# oddhound-claude-browser: the secret-free per-run browser app. It is never `fly deploy`ed as a
# service: the worker creates one fresh Machine per run from the pinned image digest through the
# Machines API and destroys it afterwards.
#   * NO secrets: never run `fly secrets set` here (Fly gives app secrets to every Machine in the app);
#   * NO [[services]] and no public IP: the worker reaches each Machine only over the private 6PN network.
app = "oddhound-claude-browser"
primary_region = "iad"
