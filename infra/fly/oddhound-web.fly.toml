# oddhound-claude-web: Next.js UI/API (process "web") and the run worker (process "worker"), one image.
# Holds the platform secrets (set with `fly secrets`, never in this file): DATABASE_URL, META_API_KEY,
# BETTER_AUTH_SECRET, ODDHOUND_CREDENTIAL_KEY, GITHUB_CLIENT_ID/SECRET, FLY_API_TOKEN (scoped to the
# browser app only), ODDHOUND_FIXTURE_RESET_TOKEN. Same Fly organisation as the browser app, so the
# worker reaches each per-run browser Machine over the private 6PN network.
app = "oddhound-claude-web"
primary_region = "iad"

[env]
  BROWSER_RUNTIME = "fly"
  FLY_BROWSER_APP = "oddhound-claude-browser"
  FLY_REGION = "ord"
  FLY_BROWSER_IMAGE = "registry.fly.io/oddhound-claude-browser@sha256:3f15a0b6ecff876c28c05857b6e09d4566b14dc9417e6e8563b9bf08ad3fd717"
  ODDHOUND_ADMIN_EMAILS = "danravekeh123@gmail.com"
  ARTIFACT_STORE = "db"
  BETTER_AUTH_URL = "https://oddhound-claude-web.fly.dev"
  META_REASONING_EFFORT = "low"
  # Development only: the same Muse Spark 1.3 at the "contributor" price (Meta may use the prompts to improve its
  # products). Remove this line before other owners' sites are scanned.
  META_MODEL = "muse-spark-1.3-contributor"
  DEMO_TARGET_ORIGIN = "https://oddhound-claude-demo.fly.dev"
  DEMO_TARGET_RESET_URL = "https://oddhound-claude-demo.fly.dev/__lab/reset"
  DEMO_TARGET_FIXED_ORIGIN = "https://oddhound-claude-demo-fixed.fly.dev"
  DEMO_TARGET_FIXED_RESET_URL = "https://oddhound-claude-demo-fixed.fly.dev/__lab/reset"

[processes]
  web = "node scripts/next-with-env.mjs start --port 8080 --hostname 0.0.0.0"
  worker = "node /app/apps/worker/main.ts"

[http_service]
  internal_port = 8080
  force_https = true
  processes = ["web"]
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["web", "worker"]
