# oddhound-web — Next.js UI/API plus the worker process group. Holds ALL platform secrets
# (DATABASE_URL, META_API_KEY, BETTER_AUTH_SECRET, GITHUB_CLIENT_*, FLY_API_TOKEN, CONTEXT7_API_KEY).
# NOT YET DEPLOYED (no Fly token was available). Must be in the same Fly organisation as
# oddhound-browser so the worker can reach per-run browser Machines over 6PN.
app = "oddhound-web"
primary_region = "sin"

[build]
  dockerfile = "../../apps/web/Dockerfile"

[env]
  NODE_ENV = "production"
  BROWSER_RUNTIME = "fly"
  FLY_BROWSER_APP = "oddhound-browser"
  META_BASE_URL = "https://api.meta.ai/v1"
  META_MODEL = "muse-spark-1.3"
  META_REASONING_EFFORT = "low"
  ODDHOUND_LAB_MODE = "0"

[processes]
  web = "node apps/web/scripts/next-with-env.mjs start --port 8080 --hostname 0.0.0.0"
  worker = "node apps/worker/main.ts"

[http_service]
  internal_port = 8080
  force_https = true
  processes = ["web"]
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["worker"]
