#!/usr/sbin/nft -f
# Egress for the browser user (pwuser) is limited to the local proxy. The proxy user may dial out;
# which addresses it accepts is enforced in the proxy (no private/internal/metadata targets).
# Only our own table is replaced; other rules (e.g. Docker's embedded-DNS redirect) are left intact.
table inet oddhound
delete table inet oddhound

table inet oddhound {
  chain output {
    type filter hook output priority 0; policy accept;

    # Browser user: replies on the inbound control connection, and the local proxy. Nothing else:
    # no direct TCP, no UDP (WebRTC/QUIC), no DNS, no IPv6, no metadata.
    meta skuid @PW_UID@ ct state established,related accept
    meta skuid @PW_UID@ oif "lo" ip daddr 127.0.0.1 tcp dport 3128 accept
    meta skuid @PW_UID@ counter drop

    # Proxy user: may resolve DNS and dial out (address policy lives in the proxy).
    meta skuid @PROXY_UID@ accept
  }
}
